version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
        - -QF1003
        - -QF1012
        - -S1001
        - -S1024
        - -S1034
  exclusions:
    # web/node_modules 中偶有第三方内嵌 Go 文件（如 flatted），不属于本项目源码
    paths:
      - web/node_modules

issues:
  max-same-issues: 3
  max-issues-per-linter: 50
